<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Nevera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- VISTA 1: Selección de Nevera -->
  <main id="view-select" class="screen active">
    <h1 class="main-title">Selecciona una nevera</h1>
    
    <div id="fridges-container" class="fridges-list">
      <div class="fridge-card" data-fridge-id="nevera-principal" data-fridge-name="Nevera de Casa">
        <div class="fridge-img-placeholder">
          <span>Sin imagen</span>
        </div>
        <h2 class="fridge-name">Nevera de Casa</h2>
      </div>
    </div>
  </main>

  <!-- VISTA 2: Contenido de la Nevera -->
  <main id="view-fridge" class="screen">
    <header class="fridge-header">
      <button id="btn-back" class="btn-back">← Volver</button>
      <h1 id="current-fridge-title" class="fridge-title">Nevera</h1>
    </header>

    <!-- Flexbox de botones pastel -->
    <div class="actions-row">
      <button id="btn-add" class="btn-action btn-pastel-green">+ Agregar</button>
      <button id="btn-remove" class="btn-action btn-pastel-red">- Retirar</button>
    </div>

    <!-- Aviso cuando el modo retirar está activo -->
    <div id="remove-banner" class="remove-banner hidden">
      Toca <strong>Quitar</strong> en lo que sacaste de la nevera
    </div>

    <!-- Lista de alimentos en tiempo real -->
    <section class="items-section">
      <ul id="food-list" class="food-list">
        <li class="empty-msg">Cargando alimentos...</li>
      </ul>
    </section>
  </main>

  <!-- Ventana Emergente para Agregar Alimento -->
  <div id="modal-add" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="modal-title">Agregar a la nevera</h3>
      <form id="form-add-food" class="modal-form">
        <input type="text" id="input-food-name" class="modal-input" placeholder="¿Qué vas a guardar? (ej. Pollo)" required autocomplete="off">
        <input type="text" id="input-food-qty" class="modal-input" placeholder="Cantidad (opcional, ej. 2 lb)" autocomplete="off">
        <div class="modal-buttons">
          <button type="button" id="btn-cancel-add" class="btn-modal-cancel">Cancelar</button>
          <button type="submit" class="btn-modal-save">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
